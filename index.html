<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Now</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Weather Now</h1>

  <form id="search-form">
    <input type="text" id="city-input" placeholder="Search city">
    <button type="submit">Search</button>
   <button type="button" id="location-btn">📍</button>
  </form>
  <div id="recent"></div>

  <p id="message"></p>

  <section id="current">
    <h2 id="place"></h2>
    <div id="icon"></div>
    <p id="temp"></p>
    <p id="desc"></p>
    <p id="feels"></p>
    <p id="humidity"></p>
    <p id="wind"></p>
  </section>

  <section id="forecast"></section>

  <script src="script.js"></script>
</body>
